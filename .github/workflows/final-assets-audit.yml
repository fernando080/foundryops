name: Final assets audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Clean install, release gate, and final visual capture
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      LLM_PROVIDER: stub
      FOUNDRY_MODE: mock
      FOUNDRYOPS_DB_PATH: ./data/e2e.db

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report exact commit and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify pinned OpenAPI snapshot digest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const bytes = readFileSync('src/adapters/foundry/contract/openapi.snapshot.json')
          const actual = createHash('sha256').update(bytes).digest('hex')
          const meta = readFileSync('src/adapters/foundry/contract/snapshot.meta.ts', 'utf8')
          const expected = meta.match(/SNAPSHOT_SHA256\s*=\s*'([0-9a-f]{64})'/)?.[1]
          if (!expected || actual !== expected) throw new Error(`snapshot digest mismatch: ${actual} != ${expected}`)
          console.log(`OpenAPI snapshot SHA256 verified: ${actual}`)
          NODE

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run complete release gate
        run: npm run demo-ready

      - name: Audit complete dependency graph
        run: npm audit --audit-level=high

      - name: Check final submission markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git grep -n 'LOOM_LINK_PLACEHOLDER' README.md | wc -l)" -eq 1
          if git grep -n -E 'konPerMs|kon \(per ms\)|k_on \(per ms\)' -- ':!docs/screenshots/**' ':!.github/workflows/final-assets-audit.yml'; then
            echo 'Retired kinetic unit remains.' >&2
            exit 1
          fi

      - name: Regenerate final screenshots with capture assertions
        run: npm run capture:screenshots

      - name: Ensure capture changed no non-screenshot product files
        shell: bash
        run: |
          git diff --exit-code -- ':!docs/screenshots/**'

      - name: Upload final screenshots
        uses: actions/upload-artifact@v4
        with:
          name: foundryops-final-assets-44ed2c6
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
