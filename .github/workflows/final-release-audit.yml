name: Final submission audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-submission-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Clean install, security, tests, E2E, and screenshot reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      LLM_PROVIDER: stub
      FOUNDRY_MODE: mock
      FOUNDRYOPS_DB_PATH: ./data/e2e.db

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report runtime and commit
        run: |
          git rev-parse HEAD
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify pinned OpenAPI snapshot digest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const bytes = readFileSync('src/adapters/foundry/contract/openapi.snapshot.json')
          const actual = createHash('sha256').update(bytes).digest('hex')
          const meta = readFileSync('src/adapters/foundry/contract/snapshot.meta.ts', 'utf8')
          const expected = meta.match(/SNAPSHOT_SHA256\s*=\s*'([0-9a-f]{64})'/)?.[1]
          if (!expected) throw new Error('Could not read SNAPSHOT_SHA256')
          if (actual !== expected) throw new Error(`OpenAPI snapshot digest mismatch: ${actual} != ${expected}`)
          console.log(`OpenAPI snapshot SHA256 verified: ${actual}`)
          NODE

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run complete release gate
        run: npm run demo-ready

      - name: Audit complete dependency graph
        run: npm audit --audit-level=high

      - name: Assert retired BLI unit names are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'konPerMs|kon \(per ms\)|k_on \(per ms\)' -- ':!docs/screenshots/**' ':!.github/workflows/final-release-audit.yml'; then
            echo 'Retired or ambiguous kon unit name remains in repository.' >&2
            exit 1
          fi

      - name: Assert only the Loom placeholder remains
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -n 'PLACEHOLDER' -- ':!.github/workflows/final-release-audit.yml' || true)"
          printf '%s\n' "$matches"
          count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l)"
          test "$count" -eq 1
          printf '%s\n' "$matches" | grep 'README.md:.*LOOM_LINK_PLACEHOLDER'

      - name: Regenerate committed release screenshots
        run: npm run capture:screenshots

      - name: Assert screenshots are reproducible and tracked tree stays clean
        shell: bash
        run: |
          git diff --exit-code -- docs/screenshots
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload final screenshots
        uses: actions/upload-artifact@v4
        with:
          name: foundryops-final-release-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
