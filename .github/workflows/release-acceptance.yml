name: Release acceptance audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Clean install, security scan, tests, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      LLM_PROVIDER: stub
      FOUNDRY_MODE: mock
      FOUNDRYOPS_DB_PATH: ./data/e2e.db

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report runtime and commit
        run: |
          git rev-parse HEAD
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run complete release gate
        run: npm run demo-ready

      - name: Assert verification did not modify tracked files
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
